name: CI - Neural Network Labs (Max)

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  validate-and-test:
    name: Lint, Notebook Validation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest nbformat nbclient pandas matplotlib pillow streamlit

      - name: Validate Notebook JSON Formats
        run: |
          python -c "
          import os, nbformat
          from pathlib import Path
          
          nb_count = 0
          for p in Path('.').rglob('*.ipynb'):
              if '.ipynb_checkpoints' in str(p):
                  continue
              with open(p, 'r', encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              nbformat.validate(nb, relax_add_props=True)
              nb_count += 1
          print(f'Successfully validated {nb_count} Jupyter notebooks across all labs.')
          "

      - name: Run Core Test Suite (Labs 1, 2, 4, 5, 6, 7 & Lab 3 Regression)
        run: |
          pytest lab1/tests lab2_vllm/tests lab4_img2img/tests lab5_multimodal_captioning/tests lab6_llamaindex_agents/tests lab7_multimodal_studio/tests lab3_chroma_rag/tests/test_lab03_markdown_regression.py -v
